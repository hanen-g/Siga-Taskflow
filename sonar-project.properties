sonar.host.url=https://sonarcloud.io

# Main branch: this repo uses "main" on GitHub (not "master").
# In SonarCloud: Project Settings > Branches and Pull Requests > Main Branch Branch Name = main

sonar.organization=hanen-g
sonar.projectKey=hanen-g_siga-taskflow

# Monorepo: one SonarCloud project, two modules (see module-specific properties below)
sonar.modules=frontend,backend

# Fail CI when the Quality Gate fails (enforced in sonar.yml via SONAR_QUALITYGATE_WAIT)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
