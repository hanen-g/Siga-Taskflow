sonar.host.url=https://sonarcloud.io

# --- Project identity (update if your SonarCloud keys differ) ---
sonar.organization=hanen-g
sonar.projectKey=hanen-g_siga-taskflow

# Monorepo: analyze only the Angular app (Java backend is out of scope here)
sonar.projectBaseDir=.

# TypeScript / Angular sources
sonar.sources=frontend/src
sonar.tests=frontend/src
sonar.sourceEncoding=UTF-8

# Mark unit test files; keeps them out of main "sources" metrics
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# TypeScript compiler config used for analysis
sonar.typescript.tsconfigPath=frontend/tsconfig.app.json

# Vitest (via ng test) LCOV report — path matches @angular/build:unit-test output
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Exclude dependencies, build output, tests from duplication / main-line analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  **/out-tsc/**,\
  **/tmp/**,\
  **/bazel-out/**,\
  **/*.spec.ts,\
  **/*.test.ts

# Optional: fail CI when the Quality Gate fails (uncomment in workflow env instead if preferred)
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300
