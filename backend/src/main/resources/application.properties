# ===============================
# DATABASE CONFIGURATION
# ===============================
# Optional local overrides (gitignored). CI and SonarCloud never see this file.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/taskflow
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# FILE UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ===============================
# MAIL CONFIGURATION (GMAIL SMTP)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=taskflow.siga@gmail.com
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

taskflow.mail.from=${MAIL_FROM:taskflow.siga@gmail.com}

ollama.api.url=http://localhost:11434/api/generate
ollama.chat.api.url=http://localhost:11434/api/chat
ollama.model=llama3.2

taskflow.app.base-url=${TASKFLOW_APP_BASE_URL:http://localhost:4200}
