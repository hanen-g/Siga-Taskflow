<p-button icon="pi pi-bars" (click)="visible = true"></p-button>
<p-drawer [(visible)]="visible" styleClass="p-drawer-open">
  <ng-template pTemplate="headless">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>{{ title }}</h2>
        <span class="sidebar-close" (click)="visible = false">
          <i class="pi pi-times"></i>
        </span>
      </div>

      <nav class="menu">
        
      </nav>
    </div>
  </ng-template>
</p-drawer>
