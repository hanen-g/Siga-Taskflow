<div class="layout-topbar">
  <div class="layout-topbar-logo-container">
    <button class="layout-menu-button layout-topbar-action" (click)="layoutService.onMenuToggle()">
      <i class="pi pi-bars"></i>
    </button>
    <img
      src="assets/images/Logo taskflow.png"
      alt="TaskFlow"
      width="160"
      height="53"
      class="layout-topbar-logo logo-image" />
  </div>

  <div class="layout-topbar-actions">
    <div class="layout-config-menu">
      <button
        type="button"
        class="layout-topbar-action"
        (click)="openProjectsCalendar()"
        title="Projects and tasks calendar"
        aria-label="Projects and tasks calendar">
        <i class="pi pi-calendar"></i>
      </button>
      <button type="button" class="layout-topbar-action" (click)="toggleDarkMode()">
        <i [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
      </button>

      <div class="notification-container">
        <button
          type="button"
          class="layout-topbar-action notification-button"
          [class.has-notifications]="unreadCount > 0"
          [class.shake]="showShake"
          (click)="toggleNotifications()"
          title="Notifications"
          aria-label="Notifications">
          <p-overlaybadge
            *ngIf="unreadCount > 0; else plainBellIcon"
            [value]="unreadCount"
            severity="danger">
            <i class="pi pi-bell"></i>
          </p-overlaybadge>
          <ng-template #plainBellIcon>
            <i class="pi pi-bell"></i>
          </ng-template>
        </button>

        <div *ngIf="showNotificationPanel" class="notification-panel">
          <div class="notification-panel-header">
            <h3>Notifications</h3>
            <button type="button" class="close-btn" (click)="toggleNotifications()">
              <i class="pi pi-times"></i>
            </button>
          </div>
          <div class="notification-panel-content">
            @if (notifications.length > 0) {
              <div
                *ngFor="let notif of notifications"
                class="notification-item"
                tabindex="0"
                (click)="onNotificationClick(notif, $event)"
                (keydown.enter)="onNotificationClick(notif, $event)">
                <div class="notification-icon">
                  <i class="pi pi-info-circle"></i>
                </div>
                <div class="notification-body">
                  <p class="notification-message">{{ notif.message }}</p>
                </div>
              </div>
            } @else {
              <div class="no-notifications">
                <i class="pi pi-inbox"></i>
                <p>Aucune notification</p>
              </div>
            }
          </div>
          @if (notifications.length > 0) {
            <div class="notification-panel-footer">
              <button type="button" class="clear-btn" (click)="clearNotifications()">
                Tout effacer
              </button>
            </div>
          }
        </div>
      </div>
    </div>

    <app-projects-calendar-dialog [(visible)]="projectsCalendarOpen" />

    <button
      #topbarMenuButton
      class="layout-topbar-menu-button layout-topbar-action"
      type="button"
      (click)="toggleTopbarMenu($event)">
      <i class="pi pi-ellipsis-v"></i>
    </button>

    <div
      *ngIf="showTopbarMenu"
      #topbarMenu
      class="layout-topbar-menu">
      <div class="layout-topbar-menu-content">
        <button
          type="button"
          class="layout-topbar-action"
          [routerLink]="['/dashboard/profile']"
          (click)="closeTopbarMenu()">
          <i class="pi pi-user"></i>
          <span>{{ userName || 'Profile' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
