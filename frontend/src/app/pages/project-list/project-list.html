<div class="card">
  <div class="flex justify-content-between mb-3">
    <h2>Projects</h2>

    <button pButton label="Add Project" icon="pi pi-plus"
            (click)="showDialog()"></button>
  </div>

  <!-- PROJECT CARDS -->
  <div class="flex flex-column gap-3">
    <div class="project-card" *ngFor="let project of (projects$ | async)">

      <!-- HEADER -->
      <div class="flex justify-content-between align-items-start">
        <div>
          <h3 class="m-0">{{ project.name }}</h3>
          <small class="text-color-secondary">
            {{ project.description }}
          </small>
        </div>

        <!-- 3 DOT MENU -->
        <p-menu #menu [popup]="true" [model]="getProjectMenu(project)"></p-menu>
        <button pButton icon="pi pi-ellipsis-v"
                class="p-button-text"
                (click)="menu.toggle($event)">
        </button>
      </div>

      <!-- TASK LIST -->
      <ul class="task-list" *ngIf="project.tasks?.length">
        <li *ngFor="let task of project.tasks"
            (click)="openTaskDialog(task)">
          {{ task.title }}
        </li>
      </ul>

      <small *ngIf="!project.tasks?.length" class="text-color-secondary">
        No tasks yet
      </small>

    </div>
  </div>
</div>

<!-- PROJECT DIALOG -->
<p-dialog header="{{ isEditMode ? 'Edit Project' : 'Create Project' }}"
          [(visible)]="displayDialog"
          [modal]="true"
          [style]="{width: '400px'}">

  <div class="flex flex-column gap-3">
    <input pInputText placeholder="Name" [(ngModel)]="newProject.name">
    <input pInputText placeholder="Description" [(ngModel)]="newProject.description">

    <button pButton label="Save" (click)="saveProject()"></button>
  </div>
</p-dialog>

<!-- TASK DIALOG -->
<p-dialog header="Task Details"
          [(visible)]="taskDialogVisible"
          [modal]="true"
          [style]="{width:'400px'}">

  <div *ngIf="selectedTask">
    <h3>{{ selectedTask.title }}</h3>
    <p>{{ selectedTask.description }}</p>
    <p>Status: {{ selectedTask.status }}</p>
    <p>Assigned: {{ selectedTask.assignee?.email }}</p>
  </div>
</p-dialog>
