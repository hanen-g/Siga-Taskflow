<article
  class="project-card"
  [class.project-card--navigable]="detailBase"
  [class.project-card--paused]="isPaused"
  [class.project-card--archived]="project.archived"
  [class.project-card--delivered]="project.delivered"
  (click)="onCardNavigate($event)">
  <div class="project-banner" [style.background]="bannerColor">
    <div *ngIf="project.archived && !project.delivered" class="project-archived-hero" (click)="$event.stopPropagation()">
      <div class="project-archived-circle">
        <img
          class="project-archived-hero-img"
          src="assets/images/archived-hero.png"
          alt=""
          width="64"
          height="64"
          loading="lazy"
          decoding="async" />
      </div>
      <div class="project-archived-pill">ARCHIVED</div>
    </div>

    <div *ngIf="project.delivered" class="project-delivered-hero" (click)="$event.stopPropagation()">
      <div class="project-delivered-circle">
        <img
          class="project-delivered-hero-img"
          src="assets/images/delivery-hero.png"
          alt=""
          width="64"
          height="64"
          loading="lazy"
          decoding="async" />
      </div>
      <div class="project-delivered-pill">SUCCESS</div>
    </div>
    <p-menu *ngIf="showMenu" #menu [popup]="true" [appendTo]="'body'" [model]="menuItems" (onShow)="onMenuShow()"></p-menu>
    <button
      *ngIf="showMenu"
      pButton
      type="button"
      icon="pi pi-ellipsis-v"
      class="project-menu-button"
      (click)="$event.stopPropagation(); toggleMenu($event)">
    </button>
  </div>

  <div class="project-card-body">
    <div class="project-copy">
      <h2 class="project-title">{{ project.name }}</h2>
      <p *ngIf="project.archived && !project.delivered" class="project-archived-label">Project archived</p>
      <p *ngIf="project.delivered" class="project-delivered-label">Project delivered</p>
      <p class="project-description">
        {{ project.description || 'No description yet for this project.' }}
      </p>
      <p *ngIf="project.createdAt" class="project-created-at">
        Created {{ project.createdAt | date: 'mediumDate' }}
      </p>
    </div>

    <div *ngIf="canResumePausedProject" class="project-paused-actions">
      <button
        pButton
        type="button"
        icon="pi pi-play"
        label="Disable pause"
        class="p-button-sm p-button-warning"
        (click)="resumePausedProject($event)">
      </button>
    </div>
  </div>

  <input *ngIf="showMenu" #fileInput type="file" style="display:none" (change)="onFileSelected($event)" />
</article>
