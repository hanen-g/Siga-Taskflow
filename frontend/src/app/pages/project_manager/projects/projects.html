<div class="p-4 surface-ground min-h-screen">
  <p-toast />
  <p-confirmdialog />
  
  <div class="flex align-items-center justify-content-between mb-5 bg-white p-4 border-round-xl shadow-1">
    <div>
      <h1 class="text-3xl font-bold m-0 text-900">Project Workspace</h1>
      <p>Manage your teams and track progress</p><br>
    </div>
    <button pButton 
            label="New Project" 
            icon="pi pi-plus" 
            class="p-button-raised p-button-primary border-round-lg px-4"
            (click)="showDialog()">
    </button>
  </div>
<br>
  <div class="grid">
    <div class="col-12 md:col-6 lg:col-4 p-3" *ngFor="let project of (projects$ | async)">
      <app-project-panel
        [project]="project"
        (edit)="editProject($event)"
        (delete)="deleteProject($event)">
      </app-project-panel>
    </div>
  </div>

  <div *ngIf="!(projects$ | async)?.length" class="flex flex-column align-items-center justify-content-center py-8">
    <i class="pi pi-folder-open text-300 text-7xl mb-3"></i>
    <span class="text-600 text-xl font-medium">No projects found. Create one to get started!</span>
  </div>
</div>

<p-dialog
  [header]="isEditMode ? 'Edit Project' : 'Launch new Project'"
  [(visible)]="displayDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '500px'}">

  <ng-template pTemplate="content">
    <div class="flex flex-column mb-5 mt-3">
      <label class="font-bold mb-2">Name <span class="text-red-500">*</span></label>
      <input pInputText 
             [(ngModel)]="newProject.name" 
             class="w-full"
             placeholder="Enter project name"
             autofocus />
    </div>

    <div class="flex flex-column mb-4">
      <label class="font-bold mb-2">Description</label>
      <textarea pInputTextarea 
                rows="6"
                [(ngModel)]="newProject.description"
                class="w-full"
                placeholder="Enter project description"></textarea>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton 
            [label]="isEditMode ? 'Update' : 'Create'" 
            (click)="isEditMode ? updateProject() : createProject()">
    </button>
  </ng-template>
</p-dialog>
