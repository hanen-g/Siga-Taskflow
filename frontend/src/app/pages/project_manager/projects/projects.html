<div class="workspace-page p-4 min-h-screen">
  <p-toast />
  <p-confirmdialog />

  <div class="workspace-header">
    <div>
      <h1 class="workspace-title">{{ pageTitle }}</h1>
      <p class="workspace-subtitle">Manage your teams and track progress</p>
    </div>
    <button *ngIf="canManageProjects"
            pButton
            label="New Project"
            icon="pi pi-plus"
            class="workspace-create-button"
            (click)="showDialog()">
    </button>
  </div>

  <div *ngIf="error" class="empty-state">
    <i class="pi pi-exclamation-triangle text-300 text-6xl mb-3"></i>
    <span class="text-600 text-xl font-medium">{{ error }}</span>
  </div>

  <div *ngIf="!(projects$ | async) && !error" class="empty-state">
    <app-loader label="Loading projects..." />
  </div>

  <ng-container *ngIf="projects$ | async as projects">
  <div class="workspace-tools" *ngIf="projects.length">
    <div class="workspace-search">
      <div class="search-input-wrapper">
        <i class="pi pi-search search-icon"></i>
        <input
          type="text"
          [(ngModel)]="searchText"
          placeholder="Search"
          class="search-input" />
      </div>
    </div>
  </div>

  <div class="projects-grid" *ngIf="filteredProjects(projects).length">
    <div class="project-grid-item" *ngFor="let project of filteredProjects(projects)">
      <app-project-panel
        [project]="project"
        [detailBase]="projectDetailBase"
        [canManage]="canManageProjects"
        (edit)="editProject($event)"
        (delete)="deleteProject($event)"
        (archive)="archiveProject($event)">
      </app-project-panel>
    </div>
  </div>

  <div *ngIf="!projects.length" class="empty-state">
    <i class="pi pi-folder-open text-300 text-7xl mb-3"></i>
    <span class="text-600 text-xl font-medium">No projects found. Create one to get started!</span>
  </div>

  <div *ngIf="projects.length && !filteredProjects(projects).length" class="empty-state">
    <i class="pi pi-search text-300 text-6xl mb-3"></i>
    <span class="text-600 text-xl font-medium">No projects match your search.</span>
  </div>
  </ng-container>
</div>

<p-dialog
  *ngIf="canManageProjects"
  [header]="isEditMode ? 'Edit Project' : 'Launch new Project'"
  [visible]="displayDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{width: '500px'}"
  (onHide)="displayDialog = false">

  <ng-template pTemplate="content">
    <div class="flex flex-column mb-5 mt-3">
      <label class="font-bold mb-2">Name <span class="text-red-500">*</span></label>
      <input pInputText 
             [(ngModel)]="newProject.name" 
             class="w-full"
             placeholder="Enter project name"
             autofocus />
    </div>

    <div class="flex flex-column mb-4">
      <label class="font-bold mb-2">Description</label>
      <textarea pInputTextarea 
                rows="6"
                [(ngModel)]="newProject.description"
                class="w-full"
                placeholder="Enter project description"></textarea>
    </div>

    <div class="flex flex-column mb-2">
      <label class="font-bold mb-2">Deadline</label>
      <input
        pInputText
        type="date"
        [(ngModel)]="newProject.deadline"
        class="w-full" />
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton 
            [label]="isEditMode ? 'Update' : 'Create'" 
            (click)="isEditMode ? updateProject() : createProject()">
    </button>
  </ng-template>
</p-dialog>
