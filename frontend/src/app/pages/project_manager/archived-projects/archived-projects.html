<div class="p-4 surface-ground min-h-screen">
  <p-toast />
  <p-confirmdialog />

  <div class="flex align-items-center justify-content-between mb-5 bg-white p-4 border-round-xl shadow-1">
    <div>
      <h1 class="text-3xl font-bold m-0 text-900">Archived projects</h1>
      <p class="m-0 mt-1 text-600" *ngIf="isAdmin">Unarchive, delete, or change lifecycle as needed (admin only).</p>
      <p class="m-0 mt-1 text-600" *ngIf="!isAdmin">Read-only list. Only an administrator can unarchive a project.</p>
    </div>
  </div>

  <div *ngIf="error" class="flex flex-column align-items-center justify-content-center py-8">
    <i class="pi pi-exclamation-triangle text-300 text-7xl mb-3"></i>
    <span class="text-600 text-xl font-medium">{{ error }}</span>
  </div>

  <div *ngIf="!(archivedProjects$ | async) && !error" class="flex flex-column align-items-center justify-content-center py-8">
    <app-loader label="Loading archived projects..." />
  </div>

  <div class="grid" *ngIf="archivedProjects$ | async as archivedProjects">
    <div class="col-12 md:col-6 lg:col-4 p-3" *ngFor="let project of archivedProjects">
      <app-project-panel
        [project]="project"
        [detailBase]="detailBase"
        [adminProjectControls]="isAdmin"
        [managerMenu]="false"
        (edit)="goToProject($event)"
        (delete)="deleteProject($event)"
        (archive)="unarchiveProject($event)"
        (setPaused)="pauseProject($event)"
        (setDelivered)="deliverProject($event)">
      </app-project-panel>
    </div>

    <div *ngIf="!archivedProjects.length" class="flex flex-column align-items-center justify-content-center py-8 w-full">
      <i class="pi pi-archive text-300 text-7xl mb-3"></i>
      <span class="text-600 text-xl font-medium">No archived projects yet.</span>
    </div>
  </div>
</div>
