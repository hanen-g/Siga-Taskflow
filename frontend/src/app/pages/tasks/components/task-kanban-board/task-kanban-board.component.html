<p-toast></p-toast>

<div
  class="kanban-page"
  [class.kanban-embedded]="projectId != null"
  [class.kanban-tall-embed]="tallEmbed">
  <div class="header-row">
    <div class="pm-kanban-filters" *ngIf="isManager" role="group" aria-label="Task scope">
      <span class="pm-filter-label">Show</span>
      <div class="pm-filter-buttons">
        <button
          type="button"
          class="pm-filter-btn"
          [class.is-active]="managerKanbanFilter === 'assigned_to_me'"
          (click)="setManagerFilter('assigned_to_me')"
        >
          My assigned tasks
          <span class="pm-filter-count">{{ countManagerMyAssignedTasks() }}</span>
        </button>
        <button
          type="button"
          class="pm-filter-btn"
          [class.is-active]="managerKanbanFilter === 'assigned_to_others'"
          (click)="setManagerFilter('assigned_to_others')"
        >
          Assigned to collaborators
          <span class="pm-filter-count">{{ countManagerCollaboratorTasks() }}</span>
        </button>
      </div>
    </div>
    <div class="date-filter-controls" role="presentation">
      <div class="date-filter-controls-group" role="group" aria-label="Deadline filters">
        <span class="date-filter-label">Deadline</span>
        <div class="date-filter-buttons">
          <button
            type="button"
            class="date-filter-btn"
            [class.is-active]="dateFilter === 'all'"
            (click)="setDateFilter('all')"
          >
            All
          </button>
          <button
            type="button"
            class="date-filter-btn"
            [class.is-active]="dateFilter === 'overdue'"
            (click)="setDateFilter('overdue')"
          >
            Overdue
          </button>
          <button
            type="button"
            class="date-filter-btn"
            [class.is-active]="dateFilter === 'recently_added'"
            (click)="setDateFilter('recently_added')"
          >
            Recently added
          </button>
        </div>
      </div>
      <div class="date-filter-controls-group" role="group" aria-label="Due date order">
        <span class="date-sort-label">Order</span>
        <div class="date-filter-buttons">
          <button
            type="button"
            class="date-filter-btn"
            [class.is-active]="dateSort === 'deadline_asc'"
            (click)="setDateSort('deadline_asc')"
          >
            Soonest first
          </button>
          <button
            type="button"
            class="date-filter-btn"
            [class.is-active]="dateSort === 'deadline_desc'"
            (click)="setDateSort('deadline_desc')"
          >
            Latest first
          </button>
        </div>
      </div>
    </div>
    <div class="priority-legend" aria-label="Task priorities">
      <span class="legend-label">Priority:</span>
      <span class="legend-item">
        <span class="legend-dot priority-dot urgent"></span>
        High
      </span>
      <span class="legend-item">
        <span class="legend-dot priority-dot high"></span>
        Medium
      </span>
      <span class="legend-item">
        <span class="legend-dot priority-dot low"></span>
        Low
      </span>
    </div>
  </div>

  <div *ngIf="isLoading && !errorMessage" class="loading-state">
    <app-loader label="Loading tasks..." />
  </div>

  <div *ngIf="errorMessage" class="error-state">
    <span>{{ errorMessage }}</span>
    <button type="button" class="retry-btn" (click)="loadTasks()">Retry</button>
  </div>

  <div class="board-wrapper" *ngIf="!isLoading && !errorMessage">
    <div class="kanban-board">
      <div class="kanban-column" *ngFor="let column of columns; trackBy: trackByColumn" [ngClass]="column.colorClass">
        <div class="column-header">
          <div class="header-pill">
            <span class="title">{{ column.title }}</span>
            <p-badge [value]="countByStatus(column.status)"></p-badge>
          </div>
          <span class="header-connector" aria-hidden="true"></span>
          <span class="header-node" aria-hidden="true"></span>
        </div>

        <div
          class="column-body"
          cdkDropList
          [id]="statusListId(column.status)"
          [cdkDropListData]="tasksByStatus(column.status)"
          [cdkDropListConnectedTo]="connectedDropLists()"
          [cdkDropListDisabled]="!canDropInColumn(column)"
          [cdkDropListEnterPredicate]="canEnterColumn"
          (cdkDropListDropped)="onTaskDrop($event, column.status)"
        >
          <div class="empty-column" *ngIf="tasksByStatus(column.status).length === 0">No tasks</div>

          <div
            class="task-card"
            *ngFor="let task of tasksByStatus(column.status); trackBy: trackByTask"
            [class.on-hold]="task.status === 'ON_HOLD'"
            [class.in-review]="task.status === 'IN_REVIEW'"
            [class.done-card]="task.status === 'DONE'"
            cdkDrag
            [cdkDragDisabled]="!canDragTask(task)"
            [cdkDragData]="task"
            (click)="selectTask(task)"
          >
            <span class="card-priority-dot" [ngClass]="getPriorityClass(task.priority)"></span>
            <div class="task-title">{{ task.title }}</div>
            <div class="task-description">{{ task.projectName }}</div>
            <div class="task-deadline" [class.overdue]="isOverdue(task)">
              <span class="label">Due Date:</span>
              <span class="value">{{ formatDeadline(task.deadline) }}</span>
            </div>
            <div class="hold-reason" *ngIf="task.status === 'ON_HOLD' && task.holdReason">
              {{ task.holdReason }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-task-details-panel
  *ngIf="selectedTask"
  [task]="selectedTask"
  [showAssignedTo]="!isCollaborator && !isClient"
  [canManageStatus]="canManageSelectedTaskStatus"
  (requestStart)="requestStartFromPanel($event)"
  (requestPause)="requestPauseFromPanel($event)"
  (requestResume)="requestResumeFromPanel($event)"
  (panelClose)="closeTaskDetails()"
></app-task-details-panel>

<p-dialog
  [(visible)]="pauseDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '32rem' }"
  [header]="pauseDialogTitle"
  [closable]="!pauseSubmitting"
  [closeOnEscape]="!pauseSubmitting"
  [dismissableMask]="!pauseSubmitting"
  (onHide)="cancelPauseDialog()"
>
  <div class="report-form">
    <div>
      <label for="kb-holdReason">Hold reason</label>
      <textarea
        id="kb-holdReason"
        pTextarea
        rows="5"
        [(ngModel)]="pauseHoldReason"
        placeholder="Describe why you are pausing work on this task..."
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancel"
      styleClass="p-button-text"
      [disabled]="pauseSubmitting"
      (onClick)="cancelPauseDialog()"
    ></p-button>
    <p-button
      label="Put on hold"
      styleClass="p-button-warning"
      icon="pi pi-flag"
      [disabled]="pauseSubmitting"
      [loading]="pauseSubmitting"
      (onClick)="confirmPause()"
    ></p-button>
  </ng-template>
</p-dialog>

<p-dialog
  [(visible)]="reviewDialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '30rem' }"
  [header]="reviewDialogTitle"
  (onHide)="cancelReviewDialog()"
>
  <p *ngIf="pendingTask" class="text-600 mb-3 m-0">{{ reviewConfirmIntro }}</p>
  <label class="dialog-label" for="kb-reviewNote">Note for project manager (optional):</label>
  <input id="kb-reviewNote" pInputText [(ngModel)]="reviewNote" class="w-full" />

  <ng-template pTemplate="footer">
    <p-button label="Cancel" styleClass="p-button-text" (onClick)="cancelReviewDialog()"></p-button>
    <p-button label="Submit" styleClass="p-button-help" (onClick)="confirmReview()"></p-button>
  </ng-template>
</p-dialog>
