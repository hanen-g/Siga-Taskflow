<div class="p-4 surface-ground min-h-screen">
  <p-toast></p-toast>

  <div class="flex align-items-center justify-content-between mb-5 bg-white p-4 border-round-xl shadow-1">
    <div>
      <h1 class="text-3xl font-bold m-0 text-900">My Profile</h1>
      <p>Review and update your account information.</p>
    </div>
  </div>

  <div class="bg-white shadow-1 border-round-xl p-5 max-w-2xl">
    <ng-container *ngIf="!isEditingProfile && !isChangingPassword">
      <div class="profile-pic-container mb-4 text-center">
        <ng-container *ngIf="getProfilePictureSrc(); else avatarFallback">
          <img
            [src]="getProfilePictureSrc()"
            alt="Profile Picture"
            class="profile-pic"
          />
        </ng-container>
        <ng-template #avatarFallback>
          <p-avatar [label]="getInitials()" styleClass="profile-pic"></p-avatar>
        </ng-template>
      </div>
      <div class="grid formgrid p-fluid">
        <div class="field col-12 md:col-6">
          <label>First Name</label>
          <div class="profile-value">{{ firstName }}</div>
        </div>

        <div class="field col-12 md:col-6">
          <label>Last Name</label>
          <div class="profile-value">{{ lastName }}</div>
        </div>

        <div class="field col-12">
          <label>Email</label>
          <div class="profile-value">{{ email }}</div>
        </div>

      </div>

      <div class="flex justify-content-end gap-3 mt-4">
        <button pButton type="button" label="Edit Profile" class="p-button-outlined" (click)="enterEditMode()"></button>
        <button pButton type="button" label="Change Password" class="p-button-primary" (click)="enterChangePasswordMode()"></button>
      </div>
    </ng-container>

    <ng-container *ngIf="isEditingProfile">
      <div class="grid formgrid p-fluid">
        <div class="field col-12 md:col-6">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" pInputText [(ngModel)]="firstName" />
        </div>

        <div class="field col-12 md:col-6">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" pInputText [(ngModel)]="lastName" />
        </div>

        <div class="field col-12">
          <label for="email">Email</label>
          <input id="email" type="text" pInputText [value]="email" readonly />
        </div>

        <div class="field col-12">
          <label>Profile Picture</label>
          <div class="profile-pic-edit">
            <ng-container *ngIf="getProfilePictureSrc(); else avatarFallbackEdit">
              <img
                [src]="getProfilePictureSrc()"
                alt="Profile Picture"
                class="profile-pic"
              />
            </ng-container>
            <ng-template #avatarFallbackEdit>
              <p-avatar [label]="getInitials()" styleClass="profile-pic"></p-avatar>
            </ng-template>
            <input type="file" accept="image/*" (change)="onProfilePictureChange($event)" />
          </div>
        </div>
      </div>

      <div class="flex justify-content-end gap-3 mt-4">
        <button pButton type="button" label="Cancel" class="p-button-text" (click)="cancelEditing()"></button>
        <button pButton type="button" label="Save" class="p-button-primary" [loading]="isLoading" (click)="saveProfile()"></button>
      </div>
    </ng-container>

    <p-dialog header="Change Password" [(visible)]="showPasswordDialog" [modal]="true" [closable]="false" [style]="{ width: '420px' }">
      <div class="grid formgrid p-fluid">
        <div class="field col-12">
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" type="password" pPassword [(ngModel)]="currentPassword" feedback="false" />
        </div>

        <div class="field col-12">
          <label for="password">New Password</label>
          <input id="password" type="password" pPassword [(ngModel)]="password" feedback="false" />
        </div>

        <div class="field col-12">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" pPassword [(ngModel)]="confirmPassword" feedback="false" />
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-3">
          <button pButton type="button" label="Cancel" class="p-button-text" (click)="cancelEditing()"></button>
          <button pButton type="button" label="Change Password" class="p-button-primary" [loading]="isLoading" (click)="savePassword()"></button>
        </div>
      </ng-template>
    </p-dialog>
  </div>
</div>
