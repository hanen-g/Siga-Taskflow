<div class="profile-page">
  <p-toast></p-toast>

  <section class="profile-shell">
    <header class="profile-hero">
      <h1>My Profile</h1>
      <p>Review and update your account information.</p>
    </header>

    <div class="profile-body">
      <aside class="picture-card">
        <h2>Profile Picture</h2>

        <div class="avatar-stage">
          <div class="circular-container">
            <ng-container *ngIf="profilePictureDisplaySrc; else avatarFallback">
              <img
                [src]="profilePictureDisplaySrc"
                alt="Profile picture"
                class="profile-pic"
              />
            </ng-container>
            <ng-template #avatarFallback>
              <div class="avatar-fallback">
                <p-avatar [label]="getInitials()" styleClass="profile-avatar-component" size="large"></p-avatar>
              </div>
            </ng-template>
          </div>
        </div>

        <input
          id="profilePictureUpload"
          type="file"
          accept="image/*"
          class="hidden-file-input"
          (change)="onProfilePictureChange($event)" />

        <label for="profilePictureUpload" class="upload-button">
          <i class="pi pi-upload"></i>
          <span>Change Profile Picture</span>
        </label>
      </aside>

      <div class="details-column">
        <div class="details-form">
          <div class="field-group">
            <label for="firstName">First Name</label>
            <div class="field-shell" [class.readonly-shell]="!isEditingProfile">
              <i class="pi pi-user"></i>
              <input
                id="firstName"
                type="text"
                pInputText
                [(ngModel)]="firstName"
                [readonly]="!isEditingProfile" />
            </div>
          </div>

          <div class="field-group">
            <label for="lastName">Last Name</label>
            <div class="field-shell" [class.readonly-shell]="!isEditingProfile">
              <i class="pi pi-user"></i>
              <input
                id="lastName"
                type="text"
                pInputText
                [(ngModel)]="lastName"
                [readonly]="!isEditingProfile" />
            </div>
          </div>

          <div class="field-group">
            <label for="email">Email</label>
            <div class="field-shell readonly-shell">
              <i class="pi pi-envelope"></i>
              <input
                id="email"
                type="text"
                pInputText
                [value]="email"
                readonly />
            </div>
          </div>

          <div class="field-group">
            <label for="phoneNumber">Phone number</label>
            <div class="field-shell" [class.readonly-shell]="!isEditingProfile">
              <i class="pi pi-phone"></i>
              <input
                id="phoneNumber"
                type="text"
                pInputText
                [(ngModel)]="phoneNumber"
                maxlength="40"
                [readonly]="!isEditingProfile"
                autocomplete="tel" />
            </div>
          </div>

          <div class="field-group">
            <label for="address">Address</label>
            <div class="field-shell field-shell-textarea" [class.readonly-shell]="!isEditingProfile">
              <i class="pi pi-map-marker"></i>
              <textarea
                id="address"
                pInputTextarea
                [(ngModel)]="address"
                rows="4"
                maxlength="1024"
                [readonly]="!isEditingProfile"
                autocomplete="street-address"></textarea>
            </div>
          </div>
        </div>

        <section *ngIf="showSkillsSection" class="skills-card surface-card p-3 mb-3">
          <h3>Your skills</h3>
          <p class="text-600 text-sm mb-3">
            These skills are read-only; contact an administrator if updates are needed.
          </p>
          <div *ngIf="skillsUiLoading" class="py-3">
            <i class="pi pi-spin pi-spinner"></i> Loading…
          </div>
          <ng-container *ngIf="!skillsUiLoading">
            <ul class="skills-readonly-list" *ngIf="mySkills.length">
              <li *ngFor="let s of mySkills">{{ s.name }}</li>
            </ul>
            <p *ngIf="!mySkills.length" class="text-600 text-sm m-0">No skills are listed yet.</p>
          </ng-container>
        </section>

        <div class="profile-footer-row">
          <div class="action-row">
            <button
              *ngIf="!isEditingProfile"
              pButton
              type="button"
              label="Edit Profile"
              class="action-button"
              [loading]="isLoading"
              (click)="enterEditMode()"></button>
            <button
              *ngIf="isEditingProfile"
              pButton
              type="button"
              label="Save Profile"
              class="action-button"
              [loading]="isLoading"
              (click)="saveProfile()"></button>
            <button
              pButton
              type="button"
              [label]="isEditingProfile ? 'Cancel' : 'Change Password'"
              class="action-button secondary-action"
              [loading]="isLoading && !isEditingProfile"
              (click)="isEditingProfile ? cancelEditing() : enterChangePasswordMode()"></button>
          </div>

          <section class="status-card">
            <div class="status-header">
              <h3>Account Status</h3>
              <i class="pi pi-verified"></i>
            </div>
            <p>Role: {{ roleLabel }}</p>
            <p>{{ memberSinceStatusLine }}</p>
          </section>
        </div>
      </div>
    </div>
  </section>

  <p-dialog header="Change Password" [(visible)]="showPasswordDialog" [modal]="true" [closable]="false" [style]="{ width: '420px' }">
      <div class="grid formgrid p-fluid">
        <div class="field col-12">
          <label for="currentPassword">Current Password</label>
          <input id="currentPassword" type="password" pPassword [(ngModel)]="currentPassword" feedback="false" />
        </div>

        <div class="field col-12">
          <label for="password">New Password</label>
          <input id="password" type="password" pPassword [(ngModel)]="password" feedback="false" />
        </div>

        <div class="field col-12">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" pPassword [(ngModel)]="confirmPassword" feedback="false" />
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-3">
          <button pButton type="button" label="Cancel" class="p-button-text" (click)="cancelEditing()"></button>
          <button pButton type="button" label="Change Password" class="p-button-primary" [loading]="isLoading" (click)="savePassword()"></button>
        </div>
      </ng-template>
  </p-dialog>
</div>
