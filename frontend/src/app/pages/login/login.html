
<div class="login-page">
  <p-toast></p-toast>

  <section class="left-panel">
    <div class="left-bg-overlay"></div>
    <div class="left-top-logo" aria-label="SIGA logo">SIGA</div>

    <div class="left-content">
      <h1>Join Us!</h1>
      <a routerLink="/signup" class="left-signup-btn">Sign Up</a>
    </div>
  </section>

  <section class="right-panel">
    <div class="right-curve"></div>
    <div class="right-curve-outline"></div>

    <div class="right-content">
      <div class="greeting">
        <h2>Welcome Back</h2>
      </div>

      <form (ngSubmit)="login()" class="login-form" autocomplete="off">
        <p-message *ngIf="message" severity="error" [text]="message" class="error-message"></p-message>

        <div class="field icon-field">
          <i class="pi pi-user"></i>
          
          <input
            pInputText
            type="email"
            name="username"
            id="username"
            [(ngModel)]="username"
            placeholder="Enter your email"
            [disabled]="isLoading"
            required
            class="underline-input" />
        </div>

        <div class="field icon-field">
          <i class="pi pi-lock"></i>
          <input
            pInputText
            type="password"
            name="password"
            id="password"
            [(ngModel)]="password"
            placeholder="Password"
            [disabled]="isLoading"
            required
            class="underline-input" />
        </div>

        <p-button
          type="submit"
          [label]="isLoading ? 'Signing in...' : 'Sign in'"
          [disabled]="isLoading"
          [loading]="isLoading"
          class="signin-btn"
          [rounded]="true">
        </p-button>
      </form>
    </div>
  </section>
</div>
