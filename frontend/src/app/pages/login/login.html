
<div class="login-container">
  <div class="login-wrapper">
    <p-card>
      <ng-template pTemplate="header">
        <div class="login-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your account</p>
        </div>
      </ng-template>

      <form (ngSubmit)="login()" class="login-form">
        <!-- Error Message -->
        <p-message 
          *ngIf="message" 
          severity="error" 
          [text]="message"
          styleClass="w-full mb-4">
        </p-message>

        <!-- Email Field -->
        <div class="field">
          <label for="email" class="block mb-2">Email Address</label>
          <input 
            pInputText
            id="email"
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Enter your email"
            [disabled]="isLoading"
            required 
            class="w-full" />
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="password" class="block mb-2">Password</label>
          <p-password 
            id="password"
            [(ngModel)]="password" 
            name="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
            [toggleMask]="true"
            required 
            [weakLabel]="'Too simple'"
            [mediumLabel]="'Average complexity'"
            [strongLabel]="'Complex'"
            [feedback]="false"
            styleClass="w-full">
          </p-password>
        </div>

        <!-- Submit Button -->
        <p-button 
          type="submit" 
          [label]="isLoading ? 'Signing in...' : 'Sign In'"
          [disabled]="isLoading"
          [loading]="isLoading"
          severity="primary"
          styleClass="w-full mb-3"
          [rounded]="true">
        </p-button>

        <!-- Sign Up Link -->
        <div class="text-center">
          <p class="text-color-secondary">Don't have an account? 
            <a routerLink="/signup" class="font-semibold text-primary">Sign up</a>
          </p>
        </div>
      </form>
    </p-card>
  </div>
</div>
