<div class="login-page">
  <p-toast></p-toast>

  <section class="left-panel">
    <div class="left-bg-overlay"></div>
    <div class="taskflow-logo-wrap">
      <img
        src="assets/images/Logo taskflow.png"
        alt="TaskFlow"
        class="taskflow-logo" />
    </div>
    <div class="left-brand">
      <img
        [src]="logoSrc"
        (error)="handleLogoError($event)"
        alt="SIGA"
        class="siga-logo" />
    </div>
  </section>

  <section class="right-panel">
    <div class="right-curve"></div>
    <div class="right-curve-outline"></div>

    <div class="right-content">
      <div class="greeting">
        <h2>Welcome Back</h2>
      </div>

      <form (ngSubmit)="login()" class="login-form" autocomplete="off">
        <p-message *ngIf="message" severity="error" class="error-message">{{ message }}</p-message>

        <div class="field icon-field">
          <i class="pi pi-user"></i>
          <input
            pInputText
            type="email"
            name="username"
            id="username"
            [(ngModel)]="username"
            placeholder="Enter your email"
            [disabled]="isLoading || isResettingPassword"
            required
            class="underline-input" />
        </div>

        <div class="field icon-field">
          <i class="pi pi-lock"></i>
          <input
            pInputText
            type="password"
            name="password"
            id="password"
            [(ngModel)]="password"
            placeholder="Password"
            [disabled]="isLoading || isResettingPassword"
            required
            class="underline-input" />
        </div>

        <div class="forgot-password-row">
          <button
            type="button"
            class="forgot-password-link"
            (click)="forgotPassword()"
            [disabled]="isLoading || isResettingPassword">
            {{ isResettingPassword ? 'Sending...' : 'Forgot password?' }}
          </button>
        </div>

<button
  type="submit"
  class="signin-btn"
  [disabled]="isLoading || isResettingPassword">
  {{ isLoading ? 'Signing in...' : 'Sign in' }}
</button>
      </form>
    </div>
  </section>
</div>
