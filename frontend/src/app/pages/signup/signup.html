
<div class="signup-container">
  <div class="signup-wrapper">
    <p-card>
      <ng-template pTemplate="header">
        <div class="signup-header">
          <h1>Create Account</h1>
          <p>Join our Team</p>
        </div>
      </ng-template>

      <form (ngSubmit)="signup()" class="signup-form">
        <!-- Error Message -->
        <p-message *ngIf="message" severity="error" styleClass="w-full mb-4">{{ message }}</p-message>

        <!-- First Name Field -->
        <div class="field">
          <label for="firstName" class="block mb-2">First Name</label>
          <input 
            pInputText
            id="firstName"
            type="text" 
            [(ngModel)]="firstName" 
            name="firstName"
            placeholder="Enter your first name"
            [disabled]="isLoading"
            required 
            class="w-full" />
        </div>

        <!-- Last Name Field -->
        <div class="field">
          <label for="lastName" class="block mb-2">Last Name</label>
          <input 
            pInputText
            id="lastName"
            type="text" 
            [(ngModel)]="lastName" 
            name="lastName"
            placeholder="Enter your last name"
            [disabled]="isLoading"
            required 
            class="w-full" />
        </div>

        <!-- Email Field -->
        <div class="field">
          <label for="email" class="block mb-2">Email Address</label>
          <input 
            pInputText
            id="email"
            type="email" 
            [(ngModel)]="email" 
            name="email"
            placeholder="Enter your email"
            [disabled]="isLoading"
            required 
            class="w-full" />
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="password" class="block mb-2">Password</label>
          <p-password 
            id="password"
            [(ngModel)]="password" 
            name="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
            [toggleMask]="true"
            required
            [weakLabel]="'Too simple'"
            [mediumLabel]="'Average complexity'"
            [strongLabel]="'Complex'"
            styleClass="w-full">
          </p-password>
        </div>

        <!-- Role Field -->
        <div class="field">
          <label for="role" class="block mb-2">Role</label>
          <p-select 
            id="role"
            [options]="roles" 
            [(ngModel)]="role" 
            name="role"
            [disabled]="isLoading"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
            placeholder="Select your role">
          </p-select>
        </div>

        <!-- Submit Button -->
        <p-button 
          type="submit" 
          [label]="isLoading ? 'Creating Account...' : 'Sign Up'"
          [disabled]="isLoading"
          [loading]="isLoading"
          severity="primary"
          styleClass="w-full mb-3"
          [rounded]="true">
        </p-button>

        <!-- Login Link -->
        <div class="text-center">
          <p class="text-color-secondary">Already have an account? 
            <a routerLink="/login" class="font-semibold text-primary">Sign in</a>
          </p>
        </div>
      </form>
    </p-card>
  </div>
</div>
