<div class="workspace-page p-4 min-h-screen">
  <p-toast />
  <div class="workspace-header">
    <div>
      <h1 class="workspace-title">Skills catalog</h1>
      <p class="workspace-subtitle">Create skills that project managers, collaborators, and projects can use for team matching.</p>
    </div>
  </div>

  <div class="add-row surface-card p-3 mb-4">
    <label class="block font-bold mb-2">Add skill</label>
    <div class="flex flex-wrap gap-2 align-items-end">
      <input
        pInputText
        class="flex-1"
        style="min-width: 200px"
        [(ngModel)]="newSkillName"
        placeholder="e.g. Java, UI design, Testing"
        (keydown.enter)="$event.preventDefault(); addSkill()"
      />
      <button pButton type="button" label="Add" [loading]="saving" [disabled]="saving" (click)="addSkill()"></button>
    </div>
  </div>

  <div *ngIf="!skills" class="empty-state">
    <app-loader label="Loading skills..." />
  </div>

  <p-table
    *ngIf="skills"
    [value]="skills"
    [rows]="20"
    [paginator]="skills.length > 20"
    [rowHover]="true"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 60%">Name</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-s>
      <tr>
        <td>{{ s.name }}</td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-text p-button-danger p-button-sm"
            label="Delete"
            (click)="remove(s)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="text-600 p-3">No skills yet. Add the first one above.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
