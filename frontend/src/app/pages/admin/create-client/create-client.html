<div class="create-client-page">
  <p-toast />

  <div class="page-header">
    <h1>Create client</h1>
    <p>Create a client account and send a random password by email.</p>
  </div>

  <div class="shell">
    <p-card styleClass="form-card">
      <ng-template pTemplate="header">
        <div class="card-header-text">
          <h2>Client account</h2>
          <p>Clients get a read-focused view of shared projects and updates.</p>
        </div>
      </ng-template>

      <p class="password-note">
        A secure password is <strong>generated by the system</strong> and sent to the client in the welcome email.
      </p>

      <p-message *ngIf="createError" severity="error" styleClass="w-full msg">{{ createError }}</p-message>

      <div class="form-grid">
        <div class="field">
          <label for="cfn">First name</label>
          <input pInputText id="cfn" [(ngModel)]="form.firstName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field">
          <label for="cln">Last name</label>
          <input pInputText id="cln" [(ngModel)]="form.lastName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field field-wide">
          <label for="cem">Email (login address)</label>
          <input
            pInputText
            id="cem"
            type="email"
            [(ngModel)]="form.email"
            [disabled]="createLoading"
            class="w-full"
            autocomplete="off"
          />
        </div>
      </div>

      <ng-template pTemplate="footer">
        <button
          pButton
          type="button"
          label="Create client and email password"
          [loading]="createLoading"
          [disabled]="createLoading"
          (click)="submit()"
        ></button>
      </ng-template>
    </p-card>
  </div>
</div>
