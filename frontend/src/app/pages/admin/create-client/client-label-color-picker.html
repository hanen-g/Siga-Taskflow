<div class="client-label-picker" [class.is-disabled]="disabled">
  <span class="client-label-picker-label">{{ heading }}</span>
  <fieldset class="container-items" [attr.aria-label]="heading" [disabled]="disabled">
    @for (c of palette; track c) {
      <button
        type="button"
        class="item-color"
        [class.selected]="isSelected(c)"
        [disabled]="disabled"
        [style.--swatch]="c"
        [attr.aria-selected]="isSelected(c)"
        [attr.aria-label]="'Color ' + c"
        (click)="pick(c)"
      ></button>
    }
  </fieldset>
</div>
