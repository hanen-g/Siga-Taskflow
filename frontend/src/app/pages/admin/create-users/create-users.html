<div class="create-users-page">
  <p-toast />
  <div class="page-header">
    <h1>Create users</h1>
    <p>Provision accounts, choose a role, and send a random password to the user by email.</p>
  </div>

  <div class="shell">
    <div class="field-label-row">
      <label for="createRole" class="field-label">Account role</label>
      <p-select
        inputId="createRole"
        [options]="createRoleOptions"
        [(ngModel)]="createRole"
        optionLabel="label"
        optionValue="value"
        placeholder="Select a role to show the form"
        [showClear]="true"
        appendTo="body"
        styleClass="role-select"
        (onChange)="onCreateRoleChange()"
      ></p-select>
    </div>

    <p-card *ngIf="createRole" styleClass="form-card">
      <ng-template pTemplate="header">
        <div class="card-header-text">
          <h2>{{ getCreateRoleTitle() }}</h2>
          <p>{{ getCreateRoleBlurb() }}</p>
        </div>
      </ng-template>

      <p class="password-note">
        A secure password is <strong>generated by the system</strong> and sent to the user in the welcome email.
      </p>

      <p-message
        *ngIf="createInfoMessage"
        severity="success"
        [text]="createInfoMessage"
        styleClass="w-full msg"
      />
      <p-message *ngIf="createError" severity="error" [text]="createError" styleClass="w-full msg" />

      <div class="form-grid">
        <div class="field">
          <label for="cfn">First name</label>
          <input pInputText id="cfn" [(ngModel)]="form.firstName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field">
          <label for="cln">Last name</label>
          <input pInputText id="cln" [(ngModel)]="form.lastName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field field-wide">
          <label for="cem">Email (login address)</label>
          <input
            pInputText
            id="cem"
            type="email"
            [(ngModel)]="form.email"
            [disabled]="createLoading"
            class="w-full"
            autocomplete="off"
          />
        </div>
        <div class="field field-wide" *ngIf="roleSupportsSkills">
          <label for="cskills">Skills</label>
          <p-multiselect
            inputId="cskills"
            [options]="allSkills"
            optionLabel="name"
            optionValue="id"
            placeholder="Select skills"
            [(ngModel)]="selectedSkillIds"
            [filter]="true"
            [showToggleAll]="true"
            display="chip"
            [maxSelectedLabels]="6"
            styleClass="w-full"
            [appendTo]="'body'"
            [disabled]="createLoading || skillsLoading"
          ></p-multiselect>
          <small class="text-500" *ngIf="skillsLoading">Loading skills...</small>
          <div class="flex gap-2 mt-2">
            <input
              pInputText
              type="text"
              [(ngModel)]="newSkillName"
              [disabled]="createLoading || addingSkill"
              placeholder="Add a new skill to catalog"
              class="w-full"
              (keydown.enter)="$event.preventDefault(); addSkillToCatalog()"
            />
            <button
              pButton
              type="button"
              label="Add skill"
              [loading]="addingSkill"
              [disabled]="createLoading || addingSkill"
              (click)="addSkillToCatalog()"
            ></button>
          </div>
        </div>
      </div>

      <ng-template pTemplate="footer">
        <button
          pButton
          type="button"
          label="Create account and email password"
          [loading]="createLoading"
          [disabled]="createLoading"
          (click)="submit()"
        ></button>
      </ng-template>
    </p-card>
  </div>
</div>
