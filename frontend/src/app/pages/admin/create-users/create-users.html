<div class="create-users-page">
  <p-toast />
  <div class="page-header">
    <h1>Create users</h1>
  </div>

  <div class="shell">
    <div class="field-label-row">
      <label class="field-label">Account role</label>
      <div class="role-tabs" role="tablist" aria-label="Account role">
        <button
          *ngFor="let role of createRoleOptions"
          type="button"
          class="role-tab"
          [ngClass]="[
            'role-tab-' + role.value.toLowerCase(),
            createRole === role.value ? 'is-active' : ''
          ]"
          [attr.aria-selected]="createRole === role.value"
          (click)="setCreateRole(role.value)"
        >
          {{ role.label }}
        </button>
      </div>
    </div>

    <p-card *ngIf="createRole" styleClass="form-card">
      <ng-template pTemplate="header">
        <div class="card-header-text">
          <h2>{{ getCreateRoleTitle() }}</h2>
        </div>
      </ng-template>

      <p-message *ngIf="createInfoMessage" severity="success" styleClass="w-full msg">
        {{ createInfoMessage }}
      </p-message>
      <p-message *ngIf="createError" severity="error" styleClass="w-full msg">{{ createError }}</p-message>

      <div class="form-grid">
        <div class="field">
          <label for="cfn">First name</label>
          <input pInputText id="cfn" [(ngModel)]="form.firstName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field">
          <label for="cln">Last name</label>
          <input pInputText id="cln" [(ngModel)]="form.lastName" [disabled]="createLoading" class="w-full" />
        </div>
        <div class="field field-wide">
          <label for="cem">Email (login address)</label>
          <input
            pInputText
            id="cem"
            type="email"
            [(ngModel)]="form.email"
            [disabled]="createLoading"
            class="w-full"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="cphone">Phone</label>
          <input
            pInputText
            id="cphone"
            type="tel"
            [(ngModel)]="form.phoneNumber"
            [disabled]="createLoading"
            class="w-full"
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="cdob">Date of birth</label>
          <input
            pInputText
            id="cdob"
            type="date"
            [(ngModel)]="form.dateOfBirth"
            [disabled]="createLoading"
            class="w-full"
          />
        </div>
        <div class="field">
          <label for="cgender">Gender</label>
          <p-select
            inputId="cgender"
            [options]="genderOptions"
            [(ngModel)]="form.gender"
            optionLabel="label"
            optionValue="value"
            placeholder="Select"
            [showClear]="false"
            appendTo="body"
            styleClass="w-full"
            [disabled]="createLoading"
          />
        </div>
        <div class="field">
          <label for="crecruit">Recruitment date</label>
          <input
            pInputText
            id="crecruit"
            type="date"
            [(ngModel)]="form.recruitmentDate"
            [disabled]="createLoading"
            class="w-full"
          />
        </div>
        <div class="field field-wide">
          <label for="caddr">Address</label>
          <textarea
            pInputTextarea
            id="caddr"
            rows="3"
            [(ngModel)]="form.address"
            [disabled]="createLoading"
            class="w-full"
            placeholder="Street, city, postal code…"
          ></textarea>
        </div>
        <div class="field field-wide" *ngIf="supportsSkills">
          <label for="cskills">Skills</label>

          @if (!skillsCatalogReady) {
            <div class="skills-catalog-loading" aria-busy="true">
              <small class="text-500">{{ skillsLoading ? 'Loading skills catalog…' : 'Preparing skills…' }}</small>
            </div>
          } @else {
            <p-multiselect
              inputId="cskills"
              [options]="allSkills"
              optionLabel="name"
              optionValue="id"
              placeholder="Select skills"
              [(ngModel)]="selectedSkillIds"
              [filter]="true"
              [showToggleAll]="true"
              display="chip"
              [maxSelectedLabels]="6"
              styleClass="w-full"
              [appendTo]="'body'"
              [disabled]="createLoading || skillsLoading"
            ></p-multiselect>
          }
          <div class="skills-catalog-row">
            <input
              pInputText
              type="text"
              [(ngModel)]="newSkillName"
              [disabled]="createLoading || addingSkill || !skillsCatalogReady"
              placeholder="New skill name"
              class="skills-catalog-input"
              (keydown.enter)="$event.preventDefault(); addSkillToCatalog()"
            />
            <button
              pButton
              type="button"
              icon="pi pi-plus"
              label="Add to catalog"
              class="skills-catalog-btn"
              [loading]="addingSkill"
              [disabled]="createLoading || addingSkill || !skillsCatalogReady"
              (click)="addSkillToCatalog()"
            ></button>
          </div>
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="form-card-footer-actions">
          <button
            pButton
            type="button"
            icon="pi pi-send"
            label="Create account"
            class="submit-create-btn"
            [loading]="createLoading"
            [disabled]="createLoading"
            (click)="submit()"
          ></button>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
