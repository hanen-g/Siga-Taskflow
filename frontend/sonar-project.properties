# Frontend module — paths are relative to frontend/ (matches Vitest LCOV SF:src/... entries)
sonar.projectBaseDir=.

sonar.sources=src
sonar.tests=src
sonar.sourceEncoding=UTF-8

sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.typescript.tsconfigPath=tsconfig.app.json

# Generated by: npm run test:coverage  (ng test --configuration=ci)
sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.angular/**,\
  **/out-tsc/**,\
  **/tmp/**,\
  **/bazel-out/**,\
  **/*.spec.ts,\
  **/*.test.ts
