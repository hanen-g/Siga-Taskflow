# SonarCloud analysis for the Taskflow monorepo (Angular frontend + Spring Boot backend).
# Runs tests with coverage first, then uploads results to SonarCloud.

name: SonarCloud Analysis

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - '**'
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'sonar-project.properties'
      - 'frontend/sonar-project.properties'
      - 'backend/sonar-project.properties'
      - '.github/workflows/sonar.yml'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'sonar-project.properties'
      - 'frontend/sonar-project.properties'
      - 'backend/sonar-project.properties'
      - '.github/workflows/sonar.yml'

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud (Full Stack)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests with LCOV coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Verify frontend LCOV report exists
        run: test -f frontend/coverage/frontend/lcov.info

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend unit and integration tests with JaCoCo
        working-directory: backend
        run: mvn test --no-transfer-progress

      - name: Verify backend JaCoCo report exists
        run: test -f backend/target/site/jacoco/jacoco.xml

      - name: Cache SonarQube Cloud scanner data
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_QUALITYGATE_WAIT: 'true'
